/* Layout: one 960px column — Next up, this week, then plan/paces/goals, then volume history. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #11161d; --ink-2: #4a5462; --muted: #788293; --line: #e0e5ec;
  --accent: #2a78d6; --accent-soft: #e5effb;
  --easy: #1baf7a; --long: #2a78d6; --quality: #eb6834; --test: #6250d6; --strength: #8a93a3; --rest: #c3c9d3; --bike: #d99400;
  --good: #008300; --warn: #a86f00;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1217; --surface: #171b22; --ink: #eef1f5; --ink-2: #b5bdca; --muted: #8590a0; --line: #2a313b;
  --accent: #3987e5; --accent-soft: #1b2a3e;
  --easy: #199e70; --long: #3987e5; --quality: #d95926; --test: #9085e9; --strength: #6e7787; --rest: #4a525e; --bike: #c98500;
  --good: #0ca30c; --warn: #c98500; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --ink: #eef1f5; --ink-2: #b5bdca; --muted: #8590a0; --line: #2a313b;
  --accent: #3987e5; --accent-soft: #1b2a3e;
  --easy: #199e70; --long: #3987e5; --quality: #d95926; --test: #9085e9; --strength: #6e7787; --rest: #4a525e; --bike: #c98500;
  --good: #0ca30c; --warn: #c98500; color-scheme: dark; }

body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2, .num { font-family: var(--display); font-weight: 700; letter-spacing: .01em; }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.tab { font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.weekdots { display: flex; gap: 6px; align-items: center; }
.weekdots span { width: 34px; height: 8px; border-radius: 4px; background: var(--line); }
.weekdots span.past { background: var(--ink-2); } .weekdots span.now { background: var(--accent); }

/* Next up */
.next { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
  display: grid; gap: 14px; border-left: 6px solid var(--c, var(--accent)); }
.next .when { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.next .when .num { font-size: 18px; text-transform: uppercase; color: var(--c); }
.next h3 { font: 700 clamp(26px, 5vw, 34px)/1.05 var(--display); margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.steps li { padding: 8px 12px; background: var(--bg); border-radius: 8px; font-variant-numeric: tabular-nums; }
.purpose { color: var(--ink-2); margin: 0; max-width: 65ch; }
.also { display: flex; gap: 8px; flex-wrap: wrap; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px;
  border-radius: 999px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
.chip.done { color: var(--good); } .chip.missed { color: var(--warn); } .chip.today { color: var(--accent); background: var(--accent-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* week grid */
.weekhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.weekhead h2 { margin: 0; }
.weeknav { display: flex; gap: 6px; }
.weeknav button { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.weeknav button:disabled { opacity: .4; cursor: default; }
.weeknav button:focus-visible, .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day .dh { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.sess { border-top: 3px solid var(--c); padding-top: 6px; display: grid; gap: 4px; min-width: 0; }
.sess .t { font-weight: 600; font-size: 13px; line-height: 1.3; }
.sess .d { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .days { grid-template-columns: 1fr; }
  .day { grid-template-columns: 64px 1fr; align-items: start; }
  .day .dh { flex-direction: column; }
  .day .list { display: grid; gap: 8px; }
}

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
.panel { min-width: 0; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
.pace { font-weight: 600; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
tr.now td { background: var(--accent-soft); }

/* goal scale */
.scale { position: relative; height: 64px; margin: 8px 6px 0; }
.scale .track { position: absolute; left: 0; right: 0; top: 30px; height: 4px; border-radius: 2px; background: var(--line); }
.scale .fill { position: absolute; left: 0; top: 30px; height: 4px; border-radius: 2px; background: var(--accent); }
.mk { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.mk i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); margin-top: 18px; display: block; }
.mk.top { top: -2px; } .mk.top i { margin-top: 0; order: 2; }
.goals { display: grid; gap: 10px; margin-top: 18px; }
.goal { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.bar { cursor: default; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px;
  border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 14px; height: 10px; border-radius: 2px; background: var(--accent); }
.sw.t { background: none; border: 1.5px dashed var(--ink-2); }

/* month calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 560px; }
.cal .wd { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  display: grid; grid-template-rows: auto 1fr; padding: 4px 5px; min-width: 0; }
.cell.blank { background: none; border-color: transparent; }
.cell.trained { background: var(--accent-soft); border-color: transparent; }
.cell.today { box-shadow: 0 0 0 2px var(--accent); }
.cell .n { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1; }
.cell.trained .n { color: var(--ink); font-weight: 600; }
.cell .ic { display: flex; gap: 2px; align-items: center; justify-content: center; flex-wrap: wrap; }
.ico { width: clamp(14px, 3.6vw, 20px); height: clamp(14px, 3.6vw, 20px); flex: none; }
.ico.run { color: var(--long); } .ico.strength { color: var(--quality); } .ico.bike { color: var(--bike); }
.ico.planned { opacity: .35; }
.calhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 560px; margin-bottom: 10px; }
.calhead .m { font: 700 20px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.calsum { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 10px; }
.key .ico { width: 16px; height: 16px; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .weeknav button { transition: background .15s; } }
</style>

</div>

    const ss = all.filter((s) => s.date === date);
    html += `<div class="day${date === TODAY ? " is-today" : ""}"><div class="dh"><span>${nice(date, { weekday: "short" })}</span><span class="tab">${nice(date, { day: "numeric", month: "short" })}</span></div><div class="list">` +
      (ss.length ? ss.map((s) => `<div class="sess" style="--c:${colorOf(s)}"><div class="t">${esc(s.title)}</div>${s.steps.length ? `<div class="d">${esc(s.steps.join(" · "))}</div>` : ""}${chip(s.st)}</div>`).join("")
        : `<div class="sess" style="--c:var(--rest)"><div class="t muted">—</div></div>`) + `</div></div>`;
  }
  $("days").innerHTML = html;
  $("prev").disabled = i === 0; $("nextw").disabled = i === D.weeks.length - 1;
}
$("prev").onclick = () => renderWeek(cur = Math.max(0, cur - 1));
$("nextw").onclick = () => renderWeek(cur = Math.min(D.weeks.length - 1, cur + 1));
renderWeek(cur);

// paces
const PACE_LABEL = { easy: "Easy", long: "Long run", threshold: "Threshold", interval: "Interval", stride: "Strides" };
$("paces").innerHTML = `<tr><th>Type</th><th>min/km</th><th>How it feels</th></tr>` + D.paces.map((p) =>
  `<tr><td>${PACE_LABEL[p.name] || esc(p.name)}</td><td class="pace">${p.min ? `${esc(p.min)}–${esc(p.max)}` : "fast"}</td><td class="small muted">${esc(p.note || "")}</td></tr>`).join("");

// goals scale
(function () {
  const A = D.athlete, lo = 38, hi = 52, x = (v) => ((v - lo) / (hi - lo)) * 100;
  const mks = [
    ...A.results.map((r) => ({ v: r.vdot, l: `${r.time} race`, c: "var(--ink-2)", top: true })),
    { v: A.current_vdot, l: `Now ~${A.current_vdot}`, c: "var(--accent)", top: false },
    ...A.goals.map((g) => ({ v: g.vdot, l: g.label.replace(" 10K", ""), c: "var(--test)", top: true })),
  ];
  $("scale").innerHTML = `<div class="track"></div><div class="fill" style="width:${x(A.current_vdot)}%"></div>` +
    mks.map((m) => `<div class="mk${m.top ? " top" : ""}" style="left:${x(m.v)}%;--c:${m.c}"><i></i><span class="tab">${esc(m.l)}</span></div>`).join("");
  $("goals").innerHTML = A.goals.map((g) => `<div class="goal"><div><strong>${esc(g.label)}</strong> <span class="muted small tab">${esc(g.time)} · ${esc(g.pace)}/km</span></div><div class="small muted">${esc(g.target)}</div></div>`).join("") +
    `<div class="small muted">Current level from: ${esc(A.current_vdot_source)}</div>`;
})();

// weekly volume chart
(function () {
  const H = D.history, W = 720, Ht = 200, pl = 28, pb = 26, pt = 8;
  const max = Math.max(10, ...H.map((h) => Math.max(h.km, h.target || 0)));
  const top = Math.ceil(max / 10) * 10, cw = (W - pl) / H.length, bw = Math.min(26, cw - 6);
  const y = (v) => pt + (Ht - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Weekly running kilometres">`;
  for (let v = 0; v <= top; v += 10) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  H.forEach((h, i) => {
    const cx = pl + cw * i + cw / 2, x0 = cx - bw / 2, isNow = TODAY >= h.start && TODAY < addDays(h.start, 7);
    if (h.target) s += `<rect x="${x0}" y="${y(h.target)}" width="${bw}" height="${y(0) - y(h.target)}" rx="4" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    if (h.km > 0) { const yt = y(h.km), r = Math.min(4, (y(0) - yt) / 2);
      s += `<path d="M${x0},${y(0)} V${yt + r} Q${x0},${yt} ${x0 + r},${yt} H${x0 + bw - r} Q${x0 + bw},${yt} ${x0 + bw},${yt + r} V${y(0)} Z" fill="var(--accent)"/>`; }
    s += `<rect class="bar" tabindex="0" data-i="${i}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${Ht - pt - pb}" fill="transparent"/>`;
    if (i % 2 === 0 || isNow) s += `<text x="${cx}" y="${Ht - 8}" text-anchor="middle"${isNow ? ' style="fill:var(--ink);font-weight:600"' : ""}>${nice(h.start, { day: "numeric", month: "short" })}</text>`;
  });
  s += `</svg><div class="tip" id="tip" hidden></div>`;
  $("chart").innerHTML = s;
  const tip = $("tip"), svg = $("chart").querySelector("svg");
  const show = (e) => {
    const h = H[+e.target.dataset.i], r = svg.getBoundingClientRect(), sc = r.width / W;
    tip.innerHTML = `Week of ${nice(h.start, { day: "numeric", month: "short" })}: <b>${h.km} km</b>, ${h.runs} run${h.runs === 1 ? "" : "s"}${h.target ? ` · plan ~${h.target} km` : ""}`;
    tip.style.left = `${(pl + cw * (+e.target.dataset.i) + cw / 2) * sc}px`;
    tip.style.top = `${y(Math.max(h.km, h.target || 0)) * sc}px`; tip.hidden = false;
  };
  svg.querySelectorAll(".bar").forEach((el) => { el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
    el.addEventListener("mouseleave", () => (tip.hidden = true)); el.addEventListener("blur", () => (tip.hidden = true)); });
})();

// month calendar
(function () {
  const ICON = {
    run: '<svg class="ico run{c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="4.5" r="2" fill="currentColor" stroke="none"/><path d="M8 10.5l5-2.5 3 3.5h3M13 8l-2 5 3 3-1 5M11 13l-2 4-4 1"/></svg>',
    bike: '<svg class="ico bike{c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-7h6l3 7M9.5 9l3.5 7H5.5M13.5 6h3l-1 3"/></svg>',
    strength: '<svg class="ico strength{c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3.5 9.5v5M7 7v10M17 7v10M20.5 9.5v5M7 12h10"/></svg>',
  };
  const icon = (k, planned) => ICON[k].replace("{c}", planned ? " planned" : "");
  $("calkey").innerHTML = `<span>${icon("run")}Run</span><span>${icon("bike")}Bike</span><span>${icon("strength")}Strength</span><span>${icon("run", true)}Planned</span>`;

  const keys = Object.keys(D.done).sort();
  const first = (keys[0] && keys[0] < b.start ? keys[0] : b.start).slice(0, 7);
  const lastM = (b.end > TODAY ? b.end : TODAY).slice(0, 7);
  let ym = TODAY.slice(0, 7);
  if (ym < first) ym = first; if (ym > lastM) ym = lastM;
  const shift = (s, n) => { let [y, m] = s.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${String(m).padStart(2, "0")}`; };

  function render() {
    const [y, m] = ym.split("-").map(Number);
    const days = new Date(y, m, 0).getDate(), off = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    $("calmonth").textContent = new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    let html = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="wd">${d}</div>`).join("");
    for (let i = 0; i < off; i++) html += `<div class="cell blank"></div>`;
    let nRun = 0, km = 0, nStr = 0, nBike = 0;
    for (let d = 1; d <= days; d++) {
      const date = `${ym}-${String(d).padStart(2, "0")}`;
      const acts = D.done[date] || [];
      const runs = acts.filter((a) => a.kind === "run"), strs = acts.filter((a) => a.kind === "strength"), bikes = acts.filter((a) => a.kind === "bike");
      nRun += runs.length; nStr += strs.length; nBike += bikes.length; km += runs.reduce((t, a) => t + a.km, 0);
      let ic = runs.map(() => icon("run")).join("") + bikes.map(() => icon("bike")).join("") + strs.map(() => icon("strength")).join("");
      const tip = [`${nice(date)}`, ...runs.map((a) => `Run ${a.km.toFixed(1)} km${a.pace ? " @ " + a.pace + "/km" : ""}`),
        ...bikes.map((a) => `Bike ${a.km.toFixed(1)} km · ${Math.round(a.min)} min`), ...strs.map((a) => `Strength ${Math.round(a.min)} min`)];
      if (!acts.length && date >= TODAY) {
        const plan = all.filter((s) => s.date === date && ["run", "bike", "strength"].includes(s.sport));
        ic = plan.map((s) => icon(s.sport, true)).join("");
        plan.forEach((s) => tip.push(`Planned: ${s.title}`));
      }
      html += `<div class="cell${acts.length ? " trained" : ""}${date === TODAY ? " today" : ""}" title="${esc(tip.join("\n"))}" aria-label="${esc(tip.join(", "))}"><span class="n">${d}</span><span class="ic">${ic}</span></div>`;
    }
    $("cal").innerHTML = html;
    $("calsum").textContent = nRun || nStr || nBike
      ? `${nRun} run${nRun === 1 ? "" : "s"} · ${km.toFixed(1)} km` + (nBike ? ` · ${nBike} ride${nBike === 1 ? "" : "s"}` : "") + ` · ${nStr} strength session${nStr === 1 ? "" : "s"}`
      : "No training recorded this month.";
    $("calprev").disabled = ym <= first; $("calnext").disabled = ym >= lastM;
  }
  $("calprev").onclick = () => { ym = shift(ym, -1); render(); };
  $("calnext").onclick = () => { ym = shift(ym, 1); render(); };
  render();
})();

// block table
$("blocktable").innerHTML = `<tr><th>Week</th><th>Focus</th><th class="r">Plan</th><th class="r">Done</th></tr>` + D.weeks.map((w, i) => {
  const km = all.filter((s) => s.week === w.week && s.st.key === "done" && s.st.act.kind === "run").reduce((t, s) => t + s.st.act.km, 0);
  const runs = w.sessions.filter((s) => s.sport === "run").length;
  return `<tr class="${i === nowIdx && TODAY >= b.start && TODAY <= b.end ? "now" : ""}"><td class="tab">${w.week.slice(-3)}<div class="small muted">${nice(w.start, { day: "numeric", month: "short" })}</div></td><td class="small">${esc(w.focus)}</td><td class="r tab">${w.target_km} km<div class="small muted">${runs} runs</div></td><td class="r tab">${w.start <= TODAY ? km.toFixed(1) + " km" : "–"}</td></tr>`;
}).join("");

$("foot").textContent = `Garmin data synced ${D.last_sync ? nice(D.last_sync.slice(0, 10)) + " " + D.last_sync.slice(11, 16) : "–"} · page built ${nice(D.generated.slice(0, 10))} ${D.generated.slice(11, 16)}`;
</script>
